name: Verify hinokoto_core

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: dart run dependency_validator

  tag-matches-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: pubspec.yaml version matches the pushed tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match pubspec.yaml's version: $version"
            exit 1
          fi
